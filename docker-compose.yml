services:
  # ---------- Local LLM server ----------
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU support (uncomment if you have NVIDIA GPU + nvidia-docker)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ---------- RAG application (single-file mode) ----------
  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-app
    depends_on:
      - ollama
    environment:
      - PYTHON_DLL=/usr/lib/x86_64-linux-gnu/libpython3.11.so
    volumes:
      - ./SampleData:/app/SampleData
    command: >
      --file /app/SampleData/sales.xlsx
      --group Category

  # ---------- Office Auditor (two-file audit mode) ----------
  rag-audit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-audit
    depends_on:
      - ollama
    environment:
      - PYTHON_DLL=/usr/lib/x86_64-linux-gnu/libpython3.11.so
    volumes:
      - ./SampleData:/app/SampleData
    command: >
      --audit
      --staff /app/SampleData/staff_list.xlsx
      --tasks /app/SampleData/task_logs.xlsx

  # ---------- Run tests ----------
  tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-tests
    entrypoint: ["python", "-m", "pytest"]
    command: ["/app/tests/", "-v", "--tb=short"]
    volumes:
      - ./tests:/app/tests
      - ./PythonScripts:/app/PythonScripts
      - ./SampleData:/app/SampleData
    profiles:
      - test

volumes:
  ollama_data:
